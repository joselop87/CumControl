<!DOCTYPE html>
<html lang="gl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CumControl - 2 Motores</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    h1 {
      margin-bottom: 10px;
      font-size: 26px;
    }
    h2 {
      margin: 15px 0 10px 0;
      font-size: 18px;
      color: #03a9f4;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      max-width: 320px;
      width: 100%;
      margin-bottom: 20px;
    }
    button {
      padding: 15px 8px;
      font-size: 15px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background-color: #03a9f4;
      color: white;
      touch-action: manipulation;
    }
    button:active {
      transform: scale(0.97);
      opacity: 0.9;
    }
    .stop-btn {
      grid-column: span 2;
      background-color: #e53935;
    }
    .special-btn {
      background-color: #9c27b0;
    }
  </style>
</head>
<body>

  <h1>CumControl</h1>

  <h2>Motor 1</h2>
  <div class="grid">
    <button class="stop-btn" onclick="enviarComando('v0', 0)">Parada</button>
    <button onclick="enviarComando('v0', 1)">Masaje</button>
    <button onclick="enviarComando('v0', 2)">Suave</button>
    <button onclick="enviarComando('v0', 3)">Fuerte</button>
    <button onclick="enviarComando('v0', 4)">Máximo CUM</button>
    <button class="special-btn" onclick="enviarComando('v0', 5)">Pulsos</button>
  </div>

  <h2>Motor 2</h2>
  <div class="grid">
    <button class="stop-btn" onclick="enviarComando('v1', 0)">Parada</button>
    <button onclick="enviarComando('v1', 1)">Masaje</button>
    <button class="special-btn" onclick="enviarComando('v1', 2)">Golpes</button>
    <button onclick="enviarComando('v1', 3)">Máximo CUM</button>
    <button class="special-btn" onclick="enviarComando('v1', 4)">Presión</button>
  </div>

  <script>
    const token = "uj-8DUfuf8pIkGRzt9vqR0naCQnLjyZt";

    function enviarComando(pin, valor) {
      const url = `https://fra1.blynk.cloud/external/api/update?token=${token}&${pin}=${valor}`;
      
      fetch(url, { mode: 'no-cors', keepalive: true })
        .then(() => console.log(`Enviado ${pin}: ${valor}`))
        .catch(err => console.error("Erro:", err));
    }
  </script>

</body>
</html>
