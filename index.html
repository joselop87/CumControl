<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CumControl V2.0 Más Chorro</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --card-bg: #12121a;
      --pene-color: #00e5ff;
      --test-color: #bd00ff;
      --latigo-color: #ff0055;
      --text: #ffffff;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    h1 {
      font-size: 2rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 25px;
      text-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
      text-align: center;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 25px;
      width: 100%;
      max-width: 400px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      border: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .card.pene { border-top: 4px solid var(--pene-color); }
    .card.testiculos { border-top: 4px solid var(--test-color); }

    h2 {
      margin: 0;
      font-size: 1.4rem;
    }

    .card.pene h2 { color: var(--pene-color); }
    .card.testiculos h2 { color: var(--test-color); }

    select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      background: #1a1a26;
      color: #fff;
      border: 1px solid #333;
      font-size: 1rem;
      outline: none;
      cursor: pointer;
    }

    .btn-latigo {
      width: 100%;
      padding: 16px;
      border-radius: 8px;
      border: none;
      background: var(--latigo-color);
      color: white;
      font-weight: bold;
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    .btn-latigo:active {
      transform: scale(0.98);
      box-shadow: 0 0 25px rgba(255, 0, 85, 0.8);
    }
  </style>
</head>
<body>

  <h1>CumControl V2.0</h1>

  <div class="container">
    <!-- PENE -->
    <div class="card pene">
      <h2>Pene</h2>
      <select id="modePene" onchange="sendMode('V1', this.value)">
        <option value="0">0: Parada</option>
        <option value="1">1: Masaje</option>
        <option value="2">2: Pulsos</option>
        <option value="3">3: In Crescendo</option>
        <option value="4">4: Caos</option>
        <option value="5">5: Máximo CUM</option>
      </select>

      <button class="btn-latigo" 
              onmousedown="sendLatigo('V3', 1)" onmouseup="sendLatigo('V3', 0)"
              ontouchstart="sendLatigo('V3', 1)" ontouchend="sendLatigo('V3', 0)">
        Látigo Pene
      </button>
    </div>

    <!-- TESTÍCULOS -->
    <div class="card testiculos">
      <h2>Testículos</h2>
      <select id="modeTest" onchange="sendMode('V2', this.value)">
        <option value="0">0: Parada</option>
        <option value="1">1: Masaje</option>
        <option value="2">2: Golpes</option>
        <option value="3">3: In Crescendo</option>
        <option value="4">4: Caos</option>
        <option value="5">5: Máximo CUM</option>
      </select>

      <button class="btn-latigo" 
              onmousedown="sendLatigo('V4', 1)" onmouseup="sendLatigo('V4', 0)"
              ontouchstart="sendLatigo('V4', 1)" ontouchend="sendLatigo('V4', 0)">
        Látigo Testículos
      </button>
    </div>
  </div>

  <script>
    const BLYNK_AUTH_TOKEN = "uj-8DUfu - ••••"; // Substitúe polo teu token real
    const BLYNK_SERVER = "https://blynk.cloud/external/api/update";

    function sendMode(pin, value) {
      fetch(`${BLYNK_SERVER}?token=${BLYNK_AUTH_TOKEN}&${pin}=${value}`)
        .catch(err => console.error("Error al enviar modo:", err));
    }

    function sendLatigo(pin, state) {
      fetch(`${BLYNK_SERVER}?token=${BLYNK_AUTH_TOKEN}&${pin}=${state}`)
        .catch(err => console.error("Error al enviar látigo:", err));
    }
  </script>
</body>
</html>
