<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CumControl V2.0 Más Chorro</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --card-bg: #12121a;
      --pene-color: #00e5ff;
      --test-color: #bd00ff;
      --latigo-color: #ff0055;
      --text: #ffffff;
      --btn-bg: #1a1a26;
      --btn-border: #2a2a3d;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
      box-sizing: border-box;
    }

    h1 {
      font-size: 1.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 20px;
      text-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
      text-align: center;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 420px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 15px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      border: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card.pene { border-top: 4px solid var(--pene-color); }
    .card.testiculos { border-top: 4px solid var(--test-color); }

    h2 {
      margin: 0 0 5px 0;
      font-size: 1.3rem;
    }

    .card.pene h2 { color: var(--pene-color); }
    .card.testiculos h2 { color: var(--test-color); }

    .modes-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .btn-mode {
      padding: 12px 8px;
      border-radius: 8px;
      background: var(--btn-bg);
      color: #ccc;
      border: 1px solid var(--btn-border);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .btn-mode:active {
      transform: scale(0.96);
    }

    .card.pene .btn-mode.active {
      background: var(--pene-color);
      color: #000;
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
      border-color: var(--pene-color);
    }

    .card.testiculos .btn-mode.active {
      background: var(--test-color);
      color: #fff;
      box-shadow: 0 0 10px rgba(189, 0, 255, 0.5);
      border-color: var(--test-color);
    }

    .btn-latigo {
      width: 100%;
      padding: 16px;
      border-radius: 8px;
      border: none;
      background: var(--latigo-color);
      color: white;
      font-weight: bold;
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      margin-top: 5px;
    }

    .btn-latigo:active {
      transform: scale(0.98);
      box-shadow: 0 0 25px rgba(255, 0, 85, 0.8);
    }

    iframe {
      display: none;
    }
  </style>
</head>
<body>

  <h1>CumControl V2.0 Más Chorro</h1>

  <div class="container">
    <!-- PENE -->
    <div class="card pene">
      <h2>Pene</h2>
      <div class="modes-grid" id="gridPene">
        <button class="btn-mode active" onclick="setMode('v1', 0, this)">0: Parada</button>
        <button class="btn-mode" onclick="setMode('v1', 1, this)">1: Masaje</button>
        <button class="btn-mode" onclick="setMode('v1', 2, this)">2: Pulsos</button>
        <button class="btn-mode" onclick="setMode('v1', 3, this)">3: In Crescendo</button>
        <button class="btn-mode" onclick="setMode('v1', 4, this)">4: Caos</button>
        <button class="btn-mode" onclick="setMode('v1', 5, this)">5: Máximo CUM</button>
      </div>

      <button class="btn-latigo" 
              onmousedown="sendLatigo('v3', 1)" onmouseup="sendLatigo('v3', 0)"
              ontouchstart="sendLatigo('v3', 1)" ontouchend="sendLatigo('v3', 0)">
        Látigo Pene
      </button>
    </div>

    <!-- TESTÍCULOS -->
    <div class="card testiculos">
      <h2>Testículos</h2>
      <div class="modes-grid" id="gridTest">
        <button class="btn-mode active" onclick="setMode('v2', 0, this)">0: Parada</button>
        <button class="btn-mode" onclick="setMode('v2', 1, this)">1: Masaje</button>
        <button class="btn-mode" onclick="setMode('v2', 2, this)">2: Golpes</button>
        <button class="btn-mode" onclick="setMode('v2', 3, this)">3: In Crescendo</button>
        <button class="btn-mode" onclick="setMode('v2', 4, this)">4: Caos</button>
        <button class="btn-mode" onclick="setMode('v2', 5, this)">5: Máximo CUM</button>
      </div>

      <button class="btn-latigo" 
              onmousedown="sendLatigo('v4', 1)" onmouseup="sendLatigo('v4', 0)"
              ontouchstart="sendLatigo('v4', 1)" ontouchend="sendLatigo('v4', 0)">
        Látigo Testículos
      </button>
    </div>
  </div>

  <!-- Marco oculto para forzar as peticións sen bloqueo do navegador -->
  <iframe name="blynk_frame" id="blynk_frame"></iframe>

  <script>
    const BLYNK_AUTH_TOKEN = "uj-8DUfuf8pIkGRzt9vqR0naCQnLjyZt";

    function sendBlynkCommand(pin, value) {
      const frame = document.getElementById('blynk_frame');
      const url = `https://fra1.blynk.cloud/external/api/update?token=${BLYNK_AUTH_TOKEN}&${pin}=${value}&_=${Date.now()}`;
      frame.src = url;
    }

    function setMode(pin, value, btn) {
      const parent = btn.parentElement;
      parent.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      sendBlynkCommand(pin, value);
    }

    function sendLatigo(pin, state) {
      sendBlynkCommand(pin, state);
    }
  </script>
</body>
</html>
